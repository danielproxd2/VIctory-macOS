# A stand-in for an Xbox title that draws: it imports the console's
# graphics runtime (d3d12_xs.dll, which no PC has, via raw-dylib), creates
# the device and draws a triangle through it. It only works when loaded
# through victory-loader and bound against our runtime.
[package]
name = "title-draw"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
