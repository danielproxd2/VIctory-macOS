name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The stand-in title and the DLLs it ships: a workspace of their own,
      # built here once for the loader's tests, which find them through
      # VICTORY_FIXTURE_DIR.
      - name: Fixtures
        run: cargo build --locked --manifest-path tests/fixtures/Cargo.toml --target-dir target/fixtures
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
        env:
          VICTORY_FIXTURE_DIR: ${{ github.workspace }}\target\fixtures\debug
